<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fivi - IA para Negocios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
        }
        .animate-bounce-slow {
            animation: bounce 1s infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-slate-900 via-slate-800 to-slate-900 h-screen text-white">
    <div id="app" class="flex flex-col h-screen">
        <!-- HEADER -->
        <div class="bg-slate-800 border-b border-slate-700 p-4 shadow-lg">
            <div class="max-w-4xl mx-auto">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-3">
                        <span class="text-3xl">🤖</span>
                        <div>
                            <h1 class="font-bold text-xl">Fivi - IA para Negocios</h1>
                            <p class="text-slate-400 text-xs">Tu asistente inteligente de ventas</p>
                        </div>
                    </div>
                    <span id="status-badge" class="text-xs px-3 py-1 bg-red-600 rounded-full">
                        ❌ Desconectado
                    </span>
                </div>

                <!-- Configurar API URL -->
                <div id="config-section" class="bg-slate-700 p-3 rounded-lg">
                    <p class="text-slate-300 text-xs mb-2">
                        Para acceso completo, configura tu URL de Render:
                    </p>
                    <div class="flex gap-2">
                        <input
                            id="api-url"
                            type="text"
                            placeholder="https://fivi-api.onrender.com"
                            class="flex-1 px-3 py-2 bg-slate-600 text-white text-sm rounded border border-slate-500 placeholder-slate-400"
                        />
                        <button
                            id="save-url-btn"
                            class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white text-sm rounded font-medium transition"
                        >
                            Guardar
                        </button>
                    </div>
                </div>

                <button
                    id="toggle-config"
                    class="text-slate-400 hover:text-slate-300 text-xs mt-2 hidden"
                >
                    ▼ Cambiar API
                </button>
            </div>
        </div>

        <!-- MESSAGES -->
        <div id="messages" class="flex-1 overflow-y-auto p-4 max-w-4xl mx-auto w-full space-y-4">
            <div class="flex justify-start">
                <div class="max-w-2xl bg-slate-700 text-slate-100 rounded-lg p-4 border border-slate-600">
                    <p class="text-sm">¡Hola! Soy Fivi 🤖</p>
                    <p class="text-sm mt-2">Escribe algo o presiona el botón 🎤 para que hable contigo.</p>
                </div>
            </div>
        </div>

        <!-- INPUT AREA -->
        <div class="bg-slate-800 border-t border-slate-700 p-4">
            <div class="max-w-4xl mx-auto">
                <div class="flex gap-2">
                    <!-- Micrófono -->
                    <button
                        id="mic-btn"
                        class="p-2 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-lg transition"
                        title="Presiona para hablar"
                    >
                        🎤
                    </button>

                    <!-- Input -->
                    <input
                        id="message-input"
                        type="text"
                        placeholder="Escribe algo..."
                        class="flex-1 px-4 py-2 bg-slate-700 text-white rounded-lg border border-slate-600 placeholder-slate-500 focus:outline-none focus:border-blue-500"
                    />

                    <!-- Enviar -->
                    <button
                        id="send-btn"
                        class="p-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition"
                        title="Enviar mensaje"
                    >
                        📤
                    </button>
                </div>

                <p class="text-slate-500 text-xs mt-2">
                    💡 Presiona 🎤 para hablar, o escribe. Presiona "Hablar" en las respuestas para escuchar.
                </p>
            </div>
        </div>
    </div>

    <script>
        // ELEMENTOS
        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const micBtn = document.getElementById('mic-btn');
        const apiUrlInput = document.getElementById('api-url');
        const saveUrlBtn = document.getElementById('save-url-btn');
        const statusBadge = document.getElementById('status-badge');
        const configSection = document.getElementById('config-section');
        const toggleConfigBtn = document.getElementById('toggle-config');

        // ESTADO
        let apiUrl = localStorage.getItem('FIVI_API_URL') || '';
        let isListening = false;
        let isSpeaking = false;
        let recognition = null;

        // INICIALIZAR VOZ
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.continuous = false;

            recognition.onstart = () => {
                isListening = true;
                micBtn.style.backgroundColor = '#dc2626';
                messageInput.placeholder = '🎤 Escuchando...';
            };

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                if (transcript) {
                    messageInput.value = transcript.trim();
                }
            };

            recognition.onend = () => {
                isListening = false;
                micBtn.style.backgroundColor = '';
                messageInput.placeholder = 'Escribe algo...';
            };
        }

        // CARGAR CONFIGURACIÓN
        if (apiUrl) {
            apiUrlInput.value = apiUrl;
            configSection.classList.add('hidden');
            toggleConfigBtn.classList.remove('hidden');
            updateStatus(true);
        }

        // GUARDAR URL
        saveUrlBtn.addEventListener('click', () => {
            const url = apiUrlInput.value.trim();
            if (url) {
                localStorage.setItem('FIVI_API_URL', url);
                apiUrl = url;
                configSection.classList.add('hidden');
                toggleConfigBtn.classList.remove('hidden');
                updateStatus(true);
                addMessage('assistant', `✅ Conectado a: ${url}\n\nAhora puedo acceder a tus datos. ¿Qué necesitas?`);
            }
        });

        // TOGGLE CONFIG
        toggleConfigBtn.addEventListener('click', () => {
            configSection.classList.toggle('hidden');
        });

        // MICRÓFONO
        micBtn.addEventListener('click', () => {
            if (isListening && recognition) {
                recognition.abort();
                isListening = false;
            } else if (recognition) {
                recognition.start();
            }
        });

        // ENVIAR MENSAJE
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            messageInput.value = '';
            addMessage('user', message);

            if (apiUrl) {
                try {
                    const response = await fetch(`${apiUrl}/api/procesar`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ mensaje: message })
                    });

                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    const data = await response.json();
                    addMessage('assistant', data.respuesta || 'Sin respuesta', data.permitir_voz !== false);
                } catch (error) {
                    addMessage('assistant', `⚠️ Error: ${error.message}`);
                }
            } else {
                // Respuesta local
                const respuesta = getLocalResponse(message);
                addMessage('assistant', respuesta);
            }
        }

        function getLocalResponse(msg) {
            const m = msg.toLowerCase();
            
            if (m.includes('hola') || m.includes('hi')) {
                return '¡Hola! Soy Fivi 🤖\n\nNecesitas configurar tu API para análisis completo.';
            }
            
            if (m.includes('cómo estás')) {
                return '¡Estoy funcionando perfecto! 💪\n\nMis sistemas están listos. Configura tu API.';
            }
            
            return 'No tengo datos aún. Configura tu API de Render.';
        }

        function addMessage(role, content, allowVoice = false) {
            const div = document.createElement('div');
            div.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;

            const msgDiv = document.createElement('div');
            msgDiv.className = `max-w-2xl rounded-lg p-4 ${
                role === 'user'
                    ? 'bg-blue-600 text-white'
                    : 'bg-slate-700 text-slate-100 border border-slate-600'
            }`;

            const p = document.createElement('p');
            p.className = 'text-sm whitespace-pre-wrap';
            p.textContent = content.replace(/\*\*/g, '');

            msgDiv.appendChild(p);

            if (role === 'assistant' && allowVoice) {
                const btn = document.createElement('button');
                btn.className = 'mt-2 px-3 py-1 text-xs rounded bg-slate-600 hover:bg-slate-500 text-white transition';
                btn.textContent = '🔊 Hablar';
                btn.addEventListener('click', () => speak(content));
                msgDiv.appendChild(btn);
            }

            div.appendChild(msgDiv);
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function speak(text) {
            if (isSpeaking) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
                return;
            }

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-ES';

            utterance.onstart = () => { isSpeaking = true; };
            utterance.onend = () => { isSpeaking = false; };
            utterance.onerror = () => { isSpeaking = false; };

            window.speechSynthesis.speak(utterance);
        }

        function updateStatus(connected) {
            if (connected) {
                statusBadge.textContent = '✅ Conectado';
                statusBadge.className = 'text-xs px-3 py-1 bg-green-600 rounded-full';
            } else {
                statusBadge.textContent = '❌ Desconectado';
                statusBadge.className = 'text-xs px-3 py-1 bg-red-600 rounded-full';
            }
        }
    </script>
</body>
</html>
