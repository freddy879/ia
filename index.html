
<h2 class="sr-only">Bot keep-alive para Render — envía ping cada 1 minutos para mantener el servidor activo</h2>

<div style="padding: 1.5rem 0;">
  <div style="display:flex; align-items:center; gap:10px; margin-bottom:1.5rem;">
    <div id="dot" style="width:10px;height:10px;border-radius:50%;background:var(--color-background-tertiary);transition:background 0.4s;"></div>
    <span id="status" style="font-size:14px;color:var(--color-text-secondary);">Inactivo</span>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:1.5rem;">
    <input id="url" type="text" placeholder="https://tu-app.onrender.com/health" style="flex:1;font-size:14px;" />
    <button id="btnStart" onclick="toggleBot()" style="white-space:nowrap;">Iniciar</button>
  </div>

  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem;">
    <div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:1rem;text-align:center;">
      <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:4px;">Pings enviados</div>
      <div id="count" style="font-size:22px;font-weight:500;">0</div>
    </div>
    <div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:1rem;text-align:center;">
      <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:4px;">Último estado</div>
      <div id="lastStatus" style="font-size:22px;font-weight:500;">—</div>
    </div>
    <div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:1rem;text-align:center;">
      <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:4px;">Próximo ping</div>
      <div id="countdown" style="font-size:22px;font-weight:500;">—</div>
    </div>
  </div>

  <div id="log" style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:1rem;font-size:12px;font-family:var(--font-mono);max-height:180px;overflow-y:auto;color:var(--color-text-secondary);"></div>
</div>

<script>
let running = false;
let timer = null;
let countdownTimer = null;
let pingCount = 0;
let secondsLeft = 0;

const INTERVAL = 1* 60;

function log(msg, ok) {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  const ts = new Date().toLocaleTimeString();
  line.style.color = ok === false ? 'var(--color-text-danger)' : ok === true ? 'var(--color-text-success)' : 'var(--color-text-secondary)';
  line.textContent = `[${ts}] ${msg}`;
  el.prepend(line);
}

async function doPing() {
  const url = document.getElementById('url').value.trim();
  if (!url) return;
  try {
    const start = Date.now();
    const r = await fetch(url, { mode: 'no-cors' });
    const ms = Date.now() - start;
    pingCount++;
    document.getElementById('count').textContent = pingCount;
    document.getElementById('lastStatus').textContent = '✓';
    document.getElementById('lastStatus').style.color = 'var(--color-text-success)';
    log(`Ping OK (~${ms}ms) → ${url}`, true);
  } catch(e) {
    pingCount++;
    document.getElementById('count').textContent = pingCount;
    document.getElementById('lastStatus').textContent = '✗';
    document.getElementById('lastStatus').style.color = 'var(--color-text-danger)';
    log(`Error: ${e.message}`, false);
  }
}

function startCountdown() {
  secondsLeft = INTERVAL;
  clearInterval(countdownTimer);
  countdownTimer = setInterval(() => {
    secondsLeft--;
    const m = Math.floor(secondsLeft / 60);
    const s = secondsLeft % 60;
    document.getElementById('countdown').textContent = `${m}:${s.toString().padStart(2,'0')}`;
    if (secondsLeft <= 0) secondsLeft = INTERVAL;
  }, 1000);
}

function toggleBot() {
  const url = document.getElementById('url').value.trim();
  if (!running) {
    if (!url) { log('Ingresa la URL primero', false); return; }
    running = true;
    document.getElementById('btnStart').textContent = 'Detener';
    document.getElementById('dot').style.background = '#1D9E75';
    document.getElementById('status').textContent = 'Activo — ping cada 1 min';
    log(`Iniciado → ${url}`);
    doPing();
    startCountdown();
    timer = setInterval(() => { doPing(); startCountdown(); }, INTERVAL * 1000);
  } else {
    running = false;
    clearInterval(timer);
    clearInterval(countdownTimer);
    document.getElementById('btnStart').textContent = 'Iniciar';
    document.getElementById('dot').style.background = 'var(--color-background-tertiary)';
    document.getElementById('status').textContent = 'Inactivo';
    document.getElementById('countdown').textContent = '—';
    log('Detenido');
  }
}
</script>
